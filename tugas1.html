* {

body {

    justify-content: center;

.container {

.card {

.profile-wrap {

.profile-wrap img {

h2 {

.desc {

.btn {

    color: #000;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    font-weight: 600;
    transition: 0.3s;
}

.btn:hover {

}

.btn-red {

    color: #fff;

}

    border-radius: 10px;
    margin: 10px 0;
}

.content p {
    font-size: 12px;
}

.content small {
    font-size: 11px;
